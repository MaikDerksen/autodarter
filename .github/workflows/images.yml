# Builds the Docker images for x86 (home server / PC) and arm64 (Raspberry Pi 5) and pushes them to
# the GitHub Container Registry:  ghcr.io/<owner>/autodarter-server | autodarter-server-board | autodarter-updater
#
#   push to main  -> :latest  (what the auto-updater follows)
#   tag v1.2.3    -> :1.2.3, :1.2, :stable
#   every build   -> :sha-<commit>  (to pin or roll back:  AUTODARTER_TAG=sha-abc1234)
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Engine tests (shared)
        working-directory: shared
        run: npm ci && npx vitest run
      - name: Typecheck server
        working-directory: server
        run: npm ci && npx tsc --noEmit -p .
      - name: Typecheck + lint app
        working-directory: app
        run: npm ci && npx tsc --noEmit && npx eslint src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Board tests
        working-directory: board
        run: pip install -r requirements.txt pytest && python -m pytest -q tests

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: autodarter-server
            context: .
            file: server/Dockerfile
          - name: autodarter-server-board
            context: board
            file: board/Dockerfile
          - name: autodarter-updater
            context: updater
            file: updater/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Image name (lower case) and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUTODARTER_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
